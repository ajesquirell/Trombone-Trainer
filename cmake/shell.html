<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Trombone Trainer</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101d2a}#stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center}canvas{display:block;touch-action:none;outline:0;max-width:100%;max-height:100%}#status{position:fixed;left:12px;bottom:8px;color:white;font:14px monospace;pointer-events:none}</style></head>
<body><div id="stage"><canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas></div><div id="status">Loading WebAssembly and fonts...</div>
<script>
var Module={canvas:document.getElementById('canvas'),print:console.log,printErr:console.error,
 onRuntimeInitialized(){document.getElementById('status').textContent='';},
 onAbort(reason){document.getElementById('status').textContent='Startup failed: '+reason;}};
Module.canvas.addEventListener('pointerdown',e=>{Module.canvas.focus();try{Module.canvas.setPointerCapture(e.pointerId);}catch(_){} });
Module.canvas.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
Module.canvas.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
</script>
{{{ SCRIPT }}}
</body></html>
